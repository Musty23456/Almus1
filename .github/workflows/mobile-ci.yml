name: Mobile CI (Android)

on:
  push:
    branches: [main]
    paths: ['mobile/**']
  pull_request:
    paths: ['mobile/**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-gen
          cd /tmp/gradle-wrapper-gen
          touch settings.gradle
          gradle wrapper --gradle-version 8.6
          cp -r gradle "$GITHUB_WORKSPACE/mobile/android/"
          cp gradlew "$GITHUB_WORKSPACE/mobile/android/"
          cp gradlew.bat "$GITHUB_WORKSPACE/mobile/android/"
          chmod +x "$GITHUB_WORKSPACE/mobile/android/gradlew"
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: almus-chat-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
