name: Mobile CI (Android)

on:
  push:
    branches: [main]
    paths: ['mobile/**']
  pull_request:
    paths: ['mobile/**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-gen
          cd /tmp/gradle-wrapper-gen

          touch settings.gradle

          gradle wrapper --gradle-version 8.6

          cp -r gradle "$GITHUB_WORKSPACE/mobile/android/"
          cp gradlew "$GITHUB_WORKSPACE/mobile/android/"
          cp gradlew.bat "$GITHUB_WORKSPACE/mobile/android/"

          chmod +x "$GITHUB_WORKSPACE/mobile/android/gradlew"

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Add Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written - push notifications enabled in this build"
          else
            echo "No GOOGLE_SERVICES_JSON secret - building without push notifications"
          fi

      - name: Build release APK
        env:
          ALMUS_API_BASE_URL: ${{ vars.ALMUS_API_BASE_URL }}
          ALMUS_SOCKET_URL: ${{ vars.ALMUS_SOCKET_URL }}
        run: |
          API_BASE_URL="${ALMUS_API_BASE_URL:-http://10.0.2.2:4000/api}"
          SOCKET_URL="${ALMUS_SOCKET_URL:-http://10.0.2.2:4000}"

          echo "Building APK with backend:"
          echo "API URL: $API_BASE_URL"
          echo "Socket URL: $SOCKET_URL"

          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SOCKET_URL="$SOCKET_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: almus-chat-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
