name: Docker Build (Backend)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['backend/**', 'backend/Dockerfile']

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push - configure registry secrets to enable push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: almus-chat-backend:ci
