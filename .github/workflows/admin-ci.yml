name: Admin Dashboard CI

on:
  push:
    branches: [main]
    paths: ['admin/**']
  pull_request:
    paths: ['admin/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: almus-chat-admin-dist
          path: admin/dist
          retention-days: 14
