name: almus_chat
description: "ALMUS CHAT — Connect. Chat. Share."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  timeago: ^3.7.0
  # Voice messages + attachments (Phase 1b)
  # Pinned: newer releases of these need a newer Flutter/Gradle than CI's Flutter 3.24.
  record: 5.1.2
  audioplayers: 6.1.0
  file_picker: 8.1.2
  path_provider: 2.1.4
  url_launcher: 6.3.0
  # Voice/video calls (WebRTC)
  flutter_webrtc: 0.11.7
  # Push notifications (FCM). Pinned to versions known to build with Flutter 3.24.
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# record_android 1.4+ uses `flutter.compileSdkVersion`, which Flutter 3.24's Gradle
# tooling doesn't support ("Could not get unknown property 'flutter'"). Keep the 1.2/1.3 line.
dependency_overrides:
  record_android: '>=1.2.0 <1.4.0'
  # record_linux 0.7.x doesn't match the newest record_platform_interface (compile error in the
  # Dart build even for Android). The 1.x line matches it.
  record_linux: '>=1.0.0'

flutter:
  uses-material-design: true
